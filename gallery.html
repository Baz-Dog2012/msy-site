<!DOCTYPE html>
<html lang="en-GB">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gallery – McCormack Stockwell Young Ltd</title>

<style>

html {
    overflow-y: scroll;
}

body {
    margin: 0;
    background: #000;
    color: #ddd;
    font-family: 'Roboto', Arial, sans-serif;
}

.wrapper {
    max-width: 1040px;
    margin: auto;
    padding: 80px 20px;
    text-align: center;
    box-sizing: border-box;
}

.logo {
    max-width: 1040px;
    width: 100%;
    margin-bottom: 70px;
    display: block;
    opacity: 1;
}

.content {
    max-width: 995px;
    margin: 0 auto;
}

/* UNIFIED STAGE FRAME */
.stage-container {
    position: relative;
    width: 900px;
    height: 900px;
    margin: -120px auto 0 auto;
}

.stage-container img.roh-slide {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%;
    max-height: 100%;
}

/* FADE ANIMATION TEMPLATE */
@keyframes fadeOverlay {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* ROH STACKING & TIMINGS */
.roh1 {
    opacity: 0;
    z-index: 1;
    animation: fadeOverlay 2s ease forwards;
    animation-delay: 1s;
}

.roh2 {
    opacity: 0;
    z-index: 2;
    animation: fadeOverlay 2s ease forwards;
    animation-delay: 3.4s;
}

.roh3 {
    opacity: 0;
    z-index: 3;
    animation: fadeOverlay 2s ease forwards;
    animation-delay: 5.8s;
}

.roh3a {
    opacity: 0;
    z-index: 4;
    animation: fadeOverlay 2s ease forwards;
    animation-delay: 8.2s;
}

.roh3b {
    opacity: 0;
    z-index: 5;
    animation: fadeOverlay 2s ease forwards;
    animation-delay: 10.6s;
}

.roh4 {
    opacity: 0;
    z-index: 6;
    animation: fadeOverlay 2s ease forwards;
    animation-delay: 13s;
}

.roh4a {
    opacity: 0;
    z-index: 7;
    animation: fadeOverlay 2s ease forwards;
    animation-delay: 15.4s;
}

.roh5 {
    opacity: 0;
    z-index: 8;
    animation: fadeOverlay 2s ease forwards;
    animation-delay: 17.8s;
}

.roh1-final {
    opacity: 0;
    z-index: 9;
    animation: fadeOverlay 2s ease forwards;
    animation-delay: 20.2s;
}

/* UNIFIED BOTTOM BLOCK */
.nav {
    position: absolute;
    top: 905px;
    left: 0;
    width: 100%;
    text-align: center;
}

.nav .block {
    display: inline-block;
}

.nav .links {
    margin-bottom: 10px;
}

.nav .links a.active {
    opacity: 0.35;
    pointer-events: none;
    cursor: default;
}

.nav .contact {
    margin-bottom: 14.35px;
    font-size: 14px;
}

.footer {
    font-size: 12px;
    color: #777;
    line-height: 1.4;
}

.footer p {
    margin: 0;
}

a {
    color: #bbb;
    text-decoration: none;
}

/* RESPONSIVE MOBILE STYLES */
@media (max-width: 768px) {
    .wrapper {
        padding: 40px 20px;
    }

    .logo {
        margin-bottom: 40px;
    }

    .stage-container {
        width: 100%;
        height: auto;
        min-height: 320px;
        margin: 0 auto;
    }

    .stage-container img.roh-slide {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        width: 100%;
        height: auto;
        margin-bottom: -100%; /* Keeps slideshow stacked vertically on mobile */
    }

    .nav {
        position: static;
        top: auto;
        left: auto;
        width: 100%;
        margin-top: 360px;
    }

    .nav .links a {
        display: inline-block;
        margin: 0 5px 10px 5px;
    }
}

</style>

</head>

<body>

<div class="wrapper">

    <img src="logo.png" alt="MSY" class="logo">

    <div class="content">

        <div class="stage-container">

            <img src="roh1.jpg" alt="Royal Opera House" class="roh-slide roh1">
            <img src="roh2.jpg" alt="Royal Opera House Structure" class="roh-slide roh2">
            <img src="roh3.jpg" alt="Royal Opera House Image 3" class="roh-slide roh3">
            <img src="roh3a.jpg" alt="Royal Opera House Image 3a" class="roh-slide roh3a">
            <img src="roh3b.jpg" alt="Royal Opera House Image 3b" class="roh-slide roh3b">
            <img src="roh4.jpg" alt="Royal Opera House Image 4" class="roh-slide roh4">
            <img src="roh4a.jpg" alt="Royal Opera House Image 4a" class="roh-slide roh4a">
            <img src="roh5.jpg" alt="Royal Opera House Image 5" class="roh-slide roh5">
            <img src="roh1.jpg" alt="Royal Opera House" class="roh-slide roh1-final">

            <!-- UNIFIED BOTTOM BLOCK -->
            <div class="nav">
                <div class="block">
                    <div class="links">
                        <a href="index.html">Home</a>
                        &nbsp;&nbsp;&nbsp;
                        <a href="approach.html">Services</a>
                        &nbsp;&nbsp;&nbsp;
                        <a href="gallery.html" class="active">Projects</a>
                        &nbsp;&nbsp;&nbsp;
                        <a href="profile.html">Profile</a>
                    </div>

                    <div class="contact">
                        <a href="mailto:engineering@msyeng.co.uk">engineering@msyeng.co.uk</a>
                    </div>

                    <div class="footer">
                        <p>
                        McCormack Stockwell Young Limited · Registered in England and Wales · Company No. 11981229 · VAT No. 326102250<br>
                        Registered Office: 843 Finchley Road, London, England, NW11 8NA
                        </p>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
